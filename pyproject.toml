[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lab_04"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"